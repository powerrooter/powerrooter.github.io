<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#252F68" />
  <title>Power Rooter Inventory</title>
  <style>
    :root {
      --red: #E41F2C;
      --red-dark: #C11824;
      --red-pale: #FEECEC;
      --blue: #252F68;
      --blue-2: #2E3A82;
      --blue-3: #1A2350;
      --blue-soft: #8E99D4;
      --blue-pale: #EDEFF7;
      --bg: #F6F7FB;
      --card: #fff;
      --text: #112337;
      --muted: #667085;
      --line: #E2E6F0;
      --green: #0F7B4F;
      --green-pale: #E7F6EE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 16px;
    }
    header {
      background: var(--blue);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .brand h1 { margin: 0; font-size: 1.2rem; letter-spacing: .01em; }
    .brand a { color: var(--blue-soft); font-size: .9rem; }
    .tabs { display: flex; gap: 4px; margin-top: 12px; }
    .tabs button {
      flex: 1;
      background: transparent;
      color: #d5dcf5;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      padding: 10px 6px;
      font-weight: 700;
      min-height: 44px;
    }
    .tabs button.active { color: #fff; border-bottom-color: var(--red); }
    .quick { display: flex; gap: 8px; margin-top: 10px; }
    .quick button { flex: 1; min-height: 46px; border-radius: 10px; font-weight: 700; }
    button.add { background: var(--red); color: #fff; border: 0; }
    button.give { background: var(--blue-2); color: #fff; border: 1px solid var(--blue-soft); }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      min-height: 40px;
    }
    button.primary { background: var(--red); color: #fff; border-color: var(--red); font-weight: 700; }
    button.blue { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
    button.tiny { min-height: 34px; font-size: .82rem; padding: 4px 10px; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
    .note, .card, .item, .vancard {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .note { background: var(--red-pale); border-color: #f3c2c6; }
    .note strong { color: var(--red-dark); }
    .workspace { display: block; }
    #detail:empty { display: none; }
    h2 { margin: 8px 0 12px; font-size: 1.15rem; }
    h3 { margin: 0 0 4px; font-size: 1rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .needs {
      background: var(--red);
      color: #fff;
      font-weight: 800;
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .ok { color: var(--green); font-weight: 700; }
    .bad { color: var(--red-dark); font-weight: 800; }
    .search, input, select, textarea {
      width: 100%;
      font: inherit;
      font-size: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      min-height: 48px;
    }
    label { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin: 10px 0 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .picks button, .loc button { margin: 6px 6px 0 0; }
    .loc button.active, .picks button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    details.cat { margin: 8px 0 12px; }
    details.cat > summary {
      cursor: pointer;
      font-weight: 700;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      list-style: none;
    }
    details.cat > summary::-webkit-details-marker { display: none; }
    details.cat.short > summary { background: var(--red-pale); border-color: #f3c2c6; color: var(--red-dark); }
    .item.low { background: var(--red-pale); border-color: #f3c2c6; }
    .item.ok { border-color: #b7e2cc; }
    .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .statgrid div { background: var(--blue-pale); border-radius: 12px; padding: 10px; text-align: center; }
    .statgrid strong { display: block; font-size: 1.3rem; }
    .error { display: none; background: var(--red-pale); color: var(--red-dark); border-radius: 10px; padding: 10px; margin: 8px 0; }
    .error.show { display: block; }
    #modal[hidden] { display: none; }
    #modal { position: fixed; inset: 0; background: rgba(17, 35, 55, .45); z-index: 40; overflow: auto; padding: 16px; }
    .modal-card { background: #fff; border-radius: 16px; padding: 16px; max-width: 560px; margin: 24px auto; }
    .vancard { cursor: pointer; }
    .vancard.selected { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
    @media (min-width: 980px) {
      .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
      #detail { display: block; position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; }
      #detail:empty { display: block; }
      .quick { width: 280px; }
      header .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .tabs { margin-top: 0; flex: 1; max-width: 520px; }
    }
    @media (max-width: 979px) {
      #detail.open { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow: auto; padding: 16px; }
    }
  </style>
</head>

      <div class="quick">

  <div class="wrap">

      <aside id="detail"></aside>

  </div>
  <div id="modal" hidden></div>

 1}, {"section": "Toilet", "item": "Fill valves (Fluidmaster)", "qty": 3}, {"section": "Toilet", "item": "Flappers", "qty": 5}, {"section": "Toilet", "item": "Ratchet wrench set", "qty": 1}, {"section": "Toilet", "item": "Lock wrench for johnny bolts", "qty": 1}, {"section": "Camera & Tools", "item": "Camera", "qty": 1}, {"section": "Camera & Tools", "item": "Locator", "qty": 1}, {"section": "Camera & Tools", "item": "Rags", "qty": 2}, {"section": "Air Tank", "item": "Maintained Air tank", "qty": 2}, {"section": "Air Tank", "item": "Hose", "qty": 1}, {"section": "Air Tank", "item": "Hose Adapter", "qty": 1}, {"section": "Air Tank", "item": "Flush bag 2\"", "qty": 1}, {"section": "Air Tank", "item": "Flush bag 1/2\"–3\"", "qty": 1}, {"section": "Air Tank", "item": "Flush bag 3\"–4\"", "qty": 1}, {"section": "Air Tank", "item": "Flush bag 3\"–6\"", "qty": 1}, {"section": "Water Testing", "item": "Water hose 150 Ft", "qty": 1}, {"section": "Water Testing", "item": "Speedy with adapter to sink / toilet", "qty": 1}, {"section": "Water Testing", "item": "Nozzle", "qty": 1}, {"section": "Drill", "item": "Electric Drill", "qty": 1}, {"section": "Drill", "item": "Carbide hole saw bit 7/8\"", "qty": 1}, {"section": "Drill", "item": "Center bits", "qty": 2}, {"section": "Drill", "item": "PVC saw hole bit 7/8\"", "qty": 2}, {"section": "Drill", "item": "Plugs 7/8\"", "qty": 5}, {"section": "Tubular Piping", "item": "Pipe Cutter", "qty": 1}, {"section": "Tubular Piping", "item": "Brass Sink traps", "qty": 2}, {"section": "Tubular Piping", "item": "P trap set 1 1/2\"", "qty": 2}, {"section": "Tubular Piping", "item": "Elbows 1 1/2\"", "qty": 5}, {"section": "Tubular Piping", "item": "Offsets 1 1/2\"", "qty": 2}, {"section": "Tubular Piping", "item": "Tail Ends 1 1/2\"", "qty": 2}, {"section": "Tubular Piping", "item": "Slip nuts & washers 1 1/2\"", "qty": 5}, {"section": "Tubular Piping", "item": "P Trap sets 1 1/4\"", "qty": 3}, {"section": "Tubular Piping", "item": "Elbows 1 1/4\"", "qty": 5}, {"section": "Tubular Piping", "item": "Offsets 1 1/4\"", "qty": 2}, {"section": "Tubular Piping", "item": "Tail ends 1 1/4\"", "qty": 2}, {"section": "Tubular Piping", "item": "Slip nuts & washers 1 1/4\"", "qty": 5}, {"section": "Caps", "item": "Caps 3\"", "qty": 5}, {"section": "Caps", "item": "Caps 3 1/2\"", "qty": 5}, {"section": "Caps", "item": "Caps 4\"", "qty": 10}, {"section": "Caps", "item": "Caps 4 1/2\"", "qty": 5}, {"section": "Caps", "item": "Jim Cap 3\"", "qty": 5}, {"section": "Caps", "item": "Jim Cap 4\"", "qty": 5}, {"section": "Caps", "item": "Jim Cap 5\"", "qty": 5}, {"section": "Caps", "item": "Test Plugs 3\"", "qty": 4}, {"section": "Caps", "item": "Test Plugs 4\"", "qty": 4}, {"section": "Couplings & Elbows", "item": "Couplings 4\"", "qty": 5}, {"section": "Couplings & Elbows", "item": "Couplings 3\"", "qty": 5}, {"section": "Couplings & Elbows", "item": "Couplings 2\"", "qty": 5}, {"section": "Couplings & Elbows", "item": "Couplings 2–1 1/2\"", "qty": 2}, {"section": "Miscellaneous", "item": "Grinder with blades", "qty": 1}, {"section": "Miscellaneous", "item": "Shop Vac", "qty": 1}, {"section": "Miscellaneous", "item": "Pump Vac", "qty": 1}, {"section": "Miscellaneous", "item": "Pump with hose", "qty": 1}, {"section": "Miscellaneous", "item": "Set of L keys", "qty": 1}, {"section": "Miscellaneous", "item": "Sledgehammer", "qty": 1}, {"section": "Miscellaneous", "item": "Chisel", "qty": 1}, {"section": "Miscellaneous", "item": "Suction cups", "qty": 2}, {"section": "Miscellaneous", "item": "Extra extension wire 25 ft", "qty": 1}, {"section": "Miscellaneous", "item": "Extra extension wire 50 ft", "qty": 1}, {"section": "Miscellaneous", "item": "Goggles", "qty": 2}, {"section": "Miscellaneous", "item": "Boxes latex gloves", "qty": 6}, {"section": "Miscellaneous", "item": "Bulb outlet adapter", "qty": 1}, {"section": "Miscellaneous", "item": "Regular / Rechargeable flashlight", "qty": 1}, {"section": "Miscellaneous", "item": "Rub     const PARAM_VAN = (new URLSearchParams(location.search).get("van") || "").trim();
    const UPDATE_NOTE = "Saving vans, part numbers, who paid, and giving stock to a van needs the updated script. In Apps Script, paste the new code, then Deploy, Manage deployments, the pencil, New version, Deploy.";

    const $ = (id) => document.getElementById(id);
    const state = {
      tab: PARAM_VAN ? "vehicles" : "parts",
      items: LIBRARY.map((it) => Object.assign({ retired: false, sku: "", supplier: "", unitCost: null, unit: "", notes: "" }, it)),
      log: [],
      vanCounts: [],
      vehicles: [],
      scriptReady: false,
      loaded: false,
      query: "",
      stockAt: "Power Brooklyn",
      selected: PARAM_VAN ? { type: "van", plate: PARAM_VAN } : null,
      detailOpen: !!PARAM_VAN
    };
    const catOpen = new Map();

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }
    function stored(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
    function store(key, value) { try { if (value) localStorage.setItem(key, value); else localStorage.removeItem(key); } catch (e) {} }
    function normPlate(value) { return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
    function itemKey(section, item) { return String(section || "") + "\n" + String(item || ""); }
    function money(value) {
      if (value == null || value === "" || !isFinite(Number(value))) return "";
      return "$" + Number(value).toFixed(2);
    }
    function paidLabel(value) { return value ? value : "Not recorded"; }
    function nyDateKey(value) {
      const s = String(value == null ? "" : value).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const d = new Date(s);
      if (isNaN(d.getTime())) return "";
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d);
      const get = (type) => parts.find((p) => p.type === type).value;
      return get("year") + "-" + get("month") + "-" + get("day");
    }
    function formatNy(value) {
      const s = String(value || "").trim();
      if (!s) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        const bits = s.split("-").map(Number);
        return new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric" }).format(new Date(Date.UTC(bits[0], bits[1] - 1, bits[2], 17)));
      }
      const d = new Date(s);
      if (isNaN(d.getTime())) return s;
      return new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }).format(d);
    }
    function timeValue(value) { const t = new Date(value).getTime(); return isNaN(t) ? 0 : t; }
    function todayISO() {
      const d = new Date();
      const z = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    }
    function activeItems() { return state.items.filter((it) => !it.retired); }
    function sectionRank(name) {
      const i = SECTIONS.indexOf(name);
      return i === -1 ? 100 : i;
    }
    function groupBySection(rows) {
      const buckets = new Map();
      rows.forEach((row) => {
        const section = row.section || "Other";
        if (!buckets.has(section)) buckets.set(section, []);
        buckets.get(section).push(row);
      });
      return Array.from(buckets.keys()).sort((a, b) => {
        const d = sectionRank(a) - sectionRank(b);
        return d !== 0 ? d : a.localeCompare(b);
      }).map((section) => ({ section, rows: buckets.get(section) }));
    }
    function sectionDetails(scope, section, shortCount, label) {
      const key = scope + "\n" + section;
      if (!catOpen.has(key)) catOpen.set(key, shortCount > 0);
      const det = document.createElement("details");
      det.className = "cat" + (shortCount > 0 ? " short" : "");
      det.dataset.key = key;
      det.open = !!catOpen.get(key);
      det.addEventListener("toggle", () => { catOpen.set(key, det.open); });
      det.appendChild(el("summary", null, label));
      return det;
    }
    function catTools() {
      const bar = el("div", "toolbar");
      const open = el("button", null, "Expand all");
      const shut = el("button", null, "Collapse all");
      open.type = "button"; shut.type = "button";
      open.addEventListener("click", () => setCats(true));
      shut.addEventListener("click", () => setCats(false));
      bar.appendChild(open); bar.appendChild(shut);
      return bar;
    }
    function setCats(open) {
      document.querySelectorAll("details.cat").forEach((det) => {
        det.open = open;
        if (det.dataset.key) catOpen.set(det.dataset.key, open);
      });
    }

    function shelfQty(section, item, location) {
      let n = 0;
      state.log.forEach((row) => {
        if (row.section !== section || row.item !== item || row.location !== location) return;
        const q = Number(row.qty) || 0;
        if (row.action === "ADD") n += q;
        else if (row.action === "TAKE" || row.action === "ISSUE") n -= q;
      });
      return n;
    }
    function fifoLots(section, item, location) {
      const rows = state.log.filter((row) => row.section === section && row.item === item && row.location === location && (row.action === "ADD" || row.action === "TAKE" || row.action === "ISSUE"))
        .slice().sort((a, b) => timeValue(a.timestamp) - timeValue(b.timestamp));
      const lots = [];
      rows.forEach((row) => {
        const qty = Number(row.qty) || 0;
        if (qty <= 0) return;
        if (row.action === "ADD") lots.push({ qty, paidBy: row.paidBy || "", unitCost: row.unitCost });
        else {
          let left = qty;
          lots.forEach((lot) => {
            if (left <= 0) return;
            const use = Math.min(lot.qty, left);
            lot.qty -= use;
            left -= use;
          });
        }
      });

    function latestReport(plate) {
      const key = normPlate(plate);

      let date = "";

    function givenSince(plate, section, item, date) {
      const key = normPlate(plate);
      let n = 0;
      state.log.forEach((row) => {
        if ((row.action !== "TAKE" && row.action !== "ISSUE") || normPlate(row.van) !== key) return;
        if (row.section !== section || row.item !== item) return;
        const day = nyDateKey(row.timestamp);
        if (date && (!day || day < date)) return;
        n += Number(row.qty) || 0;
      });
      return n;

    function onVanQty(plate, section, item) {
      const report = latestReport(plate);
      if (!report) return { have: null, actual: null, date: "", given: 0 };
      const row = report.rows.find((entry) => entry.section === section && entry.item === item);
      const actual = row && row.actual != null && isFinite(Number(row.actual)) ? Number(row.actual) : null;
      const given = givenSince(plate, section, item, report.date);

    function vehicleList() {
      const map = new Map();

      state.log.forEach((row) => {

      map.forEach((van, key) => {

    function needsCount(plate) {

      activeItems().forEach((it) => {

    function ownership() {
      const companies = LOCATIONS.concat(["Not recorded"]);

      activeItems().forEach((it) => {
        LOCATIONS.forEach((loc) => {
          fifoLots(it.section, it.item, loc).forEach((lot) => {
            const name = lot.paidBy || "Not recorded";
            if (!totals[name]) totals[name] = blank();
            totals[name].shelf += lot.qty;

              totals[name].value += lot.qty * Number(lot.unitCost);
              totals[name].valued = true;

        });

      state.log.forEach((row) => {
        if (row.action !== "TAKE" && row.action !== "ISSUE") return;

        totals[name].vans += q;
        if (row.unitCost != null && isFinite(Number(row.unitCost))) {

        }
      });

        field(form, "stockDate", "Date", "date");
        $("stockDate").value = todayISO();
        field(form, "stockInvoice", "Invoice or receipt #", "text");
        field(form, "stockNote", "Notes", "text");
      }, async (pin, button) => {
        if (!chosen) return modalError("Choose a product from the list.");
        const qty = $("stockQty").value.trim();
        if (!/^\d+$/.test(qty) || Number(qty) <= 0) return modalError("Enter a quantity greater than zero.");
        button.disabled = true;
        try {
          await post({
            action: "ADD",
            item: chosen.item,
            section: chosen.section,
            qty: Number(qty),
            location: $("stockLoc").value,
            paidBy: $("stockPaid").value,
            unitCost: $("stockCost").value.trim(),
            vendor: $("stockVendor").value.trim(),
            date: $("stockDate").value,
            invoice: $("stockInvoice").value.trim(),
            note: $("stockNote").value.trim(),
            person: "Office",
            pin
          });
          closeModal();
          if (!state.scriptReady) showError("The quantity was saved. Paid by, cost, vendor, and invoice need the script update, so they will show as Not recorded until then.");
          await load();
        } catch (err) {
          modalError(err.message);
          button.disabled = false;
        }
      });
    }
    function openGive(preset) {
      if (!state.scriptReady) {
        showError(UPDATE_NOTE);
        return;
      }
      let chosen = preset ? findItem(preset.section, preset.item) : null;
      openModal("Give to van", (form) => {
        productPicker(form, chosen, (it) => { chosen = it; });
        field(form, "giveQty", "Quantity", "number");
        if (preset && preset.qty) $("giveQty").value = String(preset.qty);
        selectField(form, "giveFrom", "From", LOCATIONS, preset && preset.location);
        const plates = vehicleList().map((van) => van.plate);
        selectField(form, "giveVan", "Van", plates.length ? plates : [""], preset && preset.van);
        field(form, "giveMech", "Mechanic", "text");
        const van = vehicleList().find((entry) => preset && normPlate(entry.plate) === normPlate(preset.van));
        if (van) $("giveMech").value = van.mechanic || "";
        $("giveVan").addEventListener("change", () => {
          const found = vehicleList().find((entry) => normPlate(entry.plate) === normPlate($("giveVan").value));
          if (found) $("giveMech").value = found.mechanic || "";
        });
        field(form, "giveDate", "Date", "date");
        $("giveDate").value = todayISO();
        field(form, "giveNote", "Notes", "text");
      }, async (pin, button) => {
        if (!chosen) return modalError("Choose a product.");
        const qty = $("giveQty").value.trim();
        if (!/^\d+$/.test(qty) || Number(qty) <= 0) return modalError("Enter a quantity greater than zero.");
        if (!$("giveVan").value) return modalError("Choose a van.");
        button.disabled = true;
        try {
          await post({
            action: "ISSUE",
            item: chosen.item,
            section: chosen.section,
            qty: Number(qty),
            location: $("giveFrom").value,
            van: $("giveVan").value,
            mechanic: $("giveMech").value.trim(),
            date: $("giveDate").value,
            note: $("giveNote").value.trim(),
            pin
          });
          closeModal();
          await load();
        } catch (err) {
          modalError(/action must be add or take/i.test(err.message || "") ? UPDATE_NOTE : err.message);
          button.disabled = false;
        }
      });
    }
    function openProductForm(existing) {
      openModal(existing ? "Edit product" : "Add product", (form) => {
        field(form, "prodName", "Name", "text");
        const names = [];
        state.items.forEach((it) => { if (it.section && names.indexOf(it.section) === -1) names.push(it.section); });
        names.sort((a, b) => sectionRank(a) - sectionRank(b));
        selectField(form, "prodSection", "Category", names.concat(["__new__"]));
        $("prodSection").querySelector("option[value='__new__']").textContent = "New category…";
        field(form, "prodNew", "New category", "text");
        $("prodNew").parentElement.hidden = true;
        $("prodSection").addEventListener("change", () => { $("prodNew").parentElement.hidden = $("prodSection").value !== "__new__"; });
        field(form, "prodSku", "Part # / SKU", "text");
        field(form, "prodSupplier", "Supplier", "text");
        field(form, "prodCost", "Unit cost", "number");
        field(form, "prodUnit", "Unit", "text");
        field(form, "prodQty", "Required qty per van", "number");
        field(form, "prodNotes", "Notes", "text");
        const active = document.createElement("input");
        active.id = "prodActive";
        active.type = "checkbox";
        active.checked = !(existing && existing.retired);
        const lab = el("label", null, " Active");
        lab.prepend(active);
        form.appendChild(lab);
        if (existing) {
          $("prodName").value = existing.item;
          if (names.indexOf(existing.section) === -1) { $("prodSection").value = "__new__"; $("prodNew").parentElement.hidden = false; $("prodNew").value = existing.section; }
          else $("prodSection").value = existing.section;
          $("prodSku").value = existing.sku || "";
          $("prodSupplier").value = existing.supplier || "";
          if (existing.unitCost != null) $("prodCost").value = String(existing.unitCost);
          $("prodUnit").value = existing.unit || "";
          $("prodQty").value = existing.qty == null ? "0" : String(existing.qty);
          $("prodNotes").value = existing.notes || "";
        } else $("prodQty").value = "1";
      }, async (pin, button) => {
        const name = $("prodName").value.trim();
        let section = $("prodSection").value;
        if (section === "__new__") section = $("prodNew").value.trim();
        const qty = $("prodQty").value.trim();
        if (!name) return modalError("Enter the product name.");
        if (!section) return modalError("Choose a category.");
        if (!/^\d+$/.test(qty)) return modalError("Required qty has to be a whole number. Use 0 for office-only parts.");
        button.disabled = true;
        try {
          const payload = {
            action: existing ? "EDIT_ITEM" : "ADD_ITEM",
            item: name,
            section,
            qty: Number(qty),
            sku: $("prodSku").value.trim(),
            supplier: $("prodSupplier").value.trim(),
            unitCost: $("prodCost").value.trim(),
            unit: $("prodUnit").value.trim(),
            notes: $("prodNotes").value.trim(),
            pin
          };
          if (existing) { payload.fromItem = existing.item; payload.fromSection = existing.section; }
          await post(payload);
          const shouldHide = !$("prodActive").checked;
          if (existing && !!existing.retired !== shouldHide) {
            await post({ action: "RETIRE_ITEM", item: name, section, retired: shouldHide, pin });
          }
          closeModal();
          if (!state.scriptReady) showError("The name, category, and required quantity were saved. Part number, supplier, cost, and notes need the script update.");
          await load();
        } catch (err) {
          modalError(err.message);
          button.disabled = false;
        }
      });
    }
    function openVehicleForm(existing) {
      if (!state.scriptReady && !(existing && existing.saved)) {
        showError(UPDATE_NOTE);
      }
      openModal(existing && existing.saved ? "Edit vehicle" : "Add vehicle", (form) => {
        field(form, "vehPlate", "License plate", "text");
        field(form, "vehMake", "Make and model", "text");
        field(form, "vehMech", "Mechanic", "text");
        selectField(form, "vehHome", "Home location", [""].concat(LOCATIONS));
        if (existing) {
          $("vehPlate").value = existing.plate || "";
          $("vehMake").value = existing.makeModel || "";
          $("vehMech").value = existing.mechanic || "";
          $("vehHome").value = existing.home || "";
        }
      }, async (pin, button) => {
        if (!state.scriptReady) return modalError(UPDATE_NOTE);
        const plate = $("vehPlate").value.trim();
        if (!plate) return modalError("Enter the license plate.");
        button.disabled = true;
        try {
          await post({
            action: existing && existing.saved ? "EDIT_VEHICLE" : "ADD_VEHICLE",
            fromPlate: existing && existing.plate,
            plate,
            makeModel: $("vehMake").value.trim(),
            mechanic: $("vehMech").value.trim(),
            home: $("vehHome").value,
            pin
          });
          closeModal();
          state.tab = "vehicles";
          state.selected = { type: "van", plate };
          await load();
        } catch (err) {
          modalError(/action must be add or take/i.test(err.message || "") ? UPDATE_NOTE : err.message);
          button.disabled = false;
        }
      });
    }
    async function retire(it, hide) {
      const pin = stored(PIN_KEY);
      if (!pin) return openProductForm(it);
      if (!confirm((hide ? "Hide " : "Show ") + it.item + "?")) return;
      try {
        await post({ action: "RETIRE_ITEM", item: it.item, section: it.section, retired: hide, pin });
        await load();
      } catch (err) { showError(err.message); }
    }
    function field(form, id, label, type) {
      form.appendChild(el("label", null, label));
      const input = document.createElement("input");
      input.id = id;
      input.type = type;
      if (type === "number") { input.min = "0"; input.step = "any"; }
      form.appendChild(input);
    }
    function selectField(form, id, label, values, selected) {
      form.appendChild(el("label", null, label));
      const select = document.createElement("select");
      select.id = id;
      values.forEach((value) => {
        const opt = el("option", null, value || "Choose");
        opt.value = value;
        select.appendChild(opt);
      });
      if (selected) select.value = selected;
      form.appendChild(select);
    }
    async function post(payload) {
      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          redirect: "follow",
          cache: "no-store",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        throw new Error("Can't reach the stock sheet. In Apps Script, set Deploy, Manage deployments, Who has access to Anyone.");
      }
      const text = await response.text();
      let data = null;
      try { data = JSON.parse(text); } catch (e) { data = null; }
      if (data && data.ok === false) {
        if (/pin/i.test(data.error || "")) store(PIN_KEY, "");
        throw new Error(data.error || "Couldn't save.");
      }
      if (!data || data.ok !== true) throw new Error("Can't reach the stock sheet. In Apps Script, set Deploy, Manage deployments, Who has access to Anyone.");
      return data;
    }
    async function load() {
      showError("");
      try {
        const response = await fetch(API_URL + (API_URL.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store", redirect: "follow" });
        const data = await response.json();
        if (!data || data.ok === false) throw new Error((data && data.error) || "Couldn't read the sheet.");
        if (Array.isArray(data.items) && data.items.length) {
          state.items = data.items.map((row) => ({
            section: row.section || "",
            item: row.item || "",
            qty: row.qty == null ? 0 : Number(row.qty),
            retired: row.retired === true || String(row.retired || "").toLowerCase() === "yes",
            sku: row.sku || "",
            supplier: row.supplier || "",
            unitCost: row.unitCost == null ? null : Number(row.unitCost),
            unit: row.unit || "",
            notes: row.notes || ""
          })).filter((row) => row.item);
        }
        state.log = (data.log || []).map((row) => Object.assign({ paidBy: "", unitCost: null, vendor: "", invoice: "" }, row, {
          action: String(row.action || "").toUpperCase(),
          paidBy: row.paidBy || ""
        }));
        state.vanCounts = data.vanCounts || [];
        state.scriptReady = Array.isArray(data.vehicles);
        state.vehicles = state.scriptReady ? data.vehicles : [];
        state.loaded = true;
      } catch (err) {
        state.loaded = true;
        showError(err.message || "Couldn't read the stock sheet. The built-in parts list is showing.");
      }
      render();
    }
    document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      state.query = "";
      render();
    }));
    $("quickAdd").addEventListener("click", openStockForm);
    $("quickGive").addEventListener("click", () => openGive(null));
    $("modal").addEventListener("click", (event) => { if (event.target.id === "modal") closeModal(); });
    load();
  </script>
</body>
</html>
